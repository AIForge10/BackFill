[project]
name = "backtrader-example"
version = "0.1.0"
description = "backtrader building blocks backed by the Webull OpenAPI (webull_bt) plus runnable examples"
readme = "docs/README.md"
requires-python = ">=3.11"
dependencies = [
    "backtrader>=1.9.78.123",
    "webull-openapi-python-sdk>=3.0.0",
    "python-dotenv>=1.0.0",
    "plotly>=5.20.0",
    "pandas>=2.0.0",
    "numpy>=1.26",
    "pyarrow>=15",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "yfinance>=0.2.40",
    "statsmodels>=0.14",
    "matplotlib>=3.8",
    "pandas-datareader>=0.10",
    "tqdm>=4.66",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Research modules are separate from the unchanged sponsor examples.
[tool.setuptools]
packages = ["webull_bt", "backfill", "strategies"]
py-modules = ["config"]
